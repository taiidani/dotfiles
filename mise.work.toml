[settings]
experimental = true
env_shell_expand = true
idiomatic_version_file_enable_tools = ["ruby"]

[settings.npm]
bun = true

# [env]
# SSH_AUTH_SOCK = "$HOME/.1password/agent.sock"

[vars]
email = "ryan.nixon@ibm.com"
zed = "zed"
zsh_addons_path = "/opt/homebrew/share"

[tools]
"aqua:go-task/task" = "latest"
"npm:agent-browser" = "latest"
awscli = "latest"
bun = "latest"
envsubst = "latest"
github-cli = "latest"
jq = "latest"
node = "25.6.1"
terraform = "1.14.3"
vault = "latest"
"github:hashicorp/roam" = "latest"
lima = "latest"
colima = "latest"
"github:hashicorp/copywrite" = "latest"
ollama = "latest"
"github:hashicorp/tfcdev" = "latest"
"go:github.com/hashicorp/tfctl-cli/cmd/tfctl" = "main"
fnox = "latest"

[bootstrap.packages]
"brew-cask:lm-studio" = "latest"
"brew-cask:tablecruncher" = "latest"
"brew:poppler" = "latest"

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
