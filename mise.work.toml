[vars]
email = "ryan.nixon@ibm.com"
zsh_addons_path = "/opt/homebrew/share"

[bootstrap]
config_roots = ["bundles/global", "bundles/macos"]

[dotfiles]
"~/.docker/config.json" = ".docker/config.json"
"~/.agents/skills/coder" = ".agents/skills/coder"
"~/.agents/skills/jira" = ".agents/skills/jira"
"~/.agents/skills/mail" = ".agents/skills/mail"
"~/.agents/skills/slack" = ".agents/skills/slack"
"~/Library/Application Support/com.mitchellh.ghostty/config" = "Library/Application Support/com.mitchellh.ghostty/config.work"
"~/Library/Application Support/espanso" = { source = "Library/Application Support/espanso", type = "symbolic" }
"~/.config/mise/config.toml" = ".config/mise-config/config.work.toml"
"~/.zshrc" = { source = "zshrc.work.zsh", mode = "template" }

[bootstrap.packages]
"brew:docker" = "latest"
"brew:mise" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-completion" = "latest"
"brew:docker-compose" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-history-substring-search" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:espanso" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:lm-studio" = "latest"
"brew-cask:tuna" = "latest"
"brew-cask:zed" = "latest"

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
